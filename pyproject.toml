[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "secenv-lite"
version = "0.1.0"
description = "Find .env files committed to git or missing from .gitignore, plus obvious API keys inside. Read-only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{name = "Alessio Auretto"}]

[project.urls]
Homepage = "https://py-forge.com/products/secenv-cli?utm_source=pypi&utm_medium=project_page&utm_campaign=secenv-lite"
Repository = "https://github.com/alessio1999xx-debug/secenv-lite"

[project.scripts]
secenv-lite = "secenv_lite:main"

[tool.setuptools]
py-modules = ["secenv_lite"]
